<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PayGuard - Team Login</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="auth-page">
  <div class="container" style="max-width: 450px; margin: 60px auto;">
    <div class="card">
      <h2 style="margin-bottom: 1.5rem; text-align: center;">Team Member Login</h2>
      <form id="loginForm">
        <div class="form-group" style="margin-bottom: 1rem;">
          <label for="email" style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Email Address</label>
          <input type="email" id="email" class="form-control" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px;">
        </div>
        <div class="form-group" style="margin-bottom: 1.5rem;">
          <label for="password" style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Password</label>
          <input type="password" id="password" class="form-control" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px;">
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; font-weight: bold; cursor: pointer;">Log In</button>
      </form>
      <div style="margin-top: 1.5rem; text-align: center; font-size: 0.95rem;">
        <p>Don't have an account? <a href="/signup.html">Sign Up</a></p>
        <p style="margin-top: 0.5rem;"><a href="/index.html">← Back to Dashboard</a></p>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (res.ok && data.success) {
          localStorage.setItem('payguard_user', JSON.stringify(data.user));
          alert('Login successful!');
          window.location.href = '/index.html';
        } else {
          alert(data.error || 'Login failed.');
        }
      } catch (err) {
        alert('Server connection error.');
      }
    });
  </script>
</body>
</html>
