<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PayGuard - Team Login</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="auth-page">
  <div class="auth-card">
    <h2>Team Member Login</h2>
    <p class="subtitle">Please enter your approved credentials to access the verification portal.</p>
    
    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" class="form-control" placeholder="name@company.com" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" class="form-control" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn btn-primary btn-full">Log In</button>
    </form>

    <div class="auth-footer">
      <p>Don't have an account? <a href="/signup.html">Sign Up</a></p>
      <p style="margin-top: 0.5rem;"><a href="/index.html" class="link-secondary">← Back to Home</a></p>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (res.ok && data.success) {
          localStorage.setItem('payguard_user', JSON.stringify(data.user));
          alert('Login successful!');
          // Redirect straight to protected Verification Portal
          window.location.replace('/verify.html');
        } else {
          alert(data.error || 'Login failed.');
        }
      } catch (err) {
        alert('Server connection error.');
      }
    });
  </script>
</body>
</html>
