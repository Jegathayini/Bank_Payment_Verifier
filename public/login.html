<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PayGuard - Team Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen">
  <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md border border-slate-200">
    <h2 class="text-2xl font-bold text-slate-800 mb-6 text-center">Team Login</h2>
    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Email</label>
        <input type="email" id="email" required class="w-full p-2.5 border rounded text-sm focus:ring-2 focus:ring-blue-500 outline-none">
      </div>
      <div>
        <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Password</label>
        <input type="password" id="password" required class="w-full p-2.5 border rounded text-sm focus:ring-2 focus:ring-blue-500 outline-none">
      </div>
      <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2.5 rounded font-semibold text-sm transition">Login</button>
    </form>
    <div class="flex justify-between items-center mt-4 text-xs text-slate-500">
      <a href="/index.html" class="hover:underline">← Back to Dashboard</a>
      <p>Need an account? <a href="/signup.html" class="text-blue-600 hover:underline">Sign up</a></p>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: document.getElementById('email').value,
          password: document.getElementById('password').value
        })
      });
      const data = await res.json();
      if (res.ok) {
        localStorage.setItem('user', JSON.stringify(data.user));
        window.location.href = '/index.html';
      } else {
        alert(data.error);
      }
    });
  </script>
</body>
</html>
