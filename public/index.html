<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PayGuard - Payment Verification Platform</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
    body { background-color: #f4f7f6; color: #333; display: flex; flex-direction: column; min-height: 100vh; }
    header { background: #1e293b; color: white; padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 28px; letter-spacing: 1px; color: #3b82f6; }
    .hero { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px; }
    .hero h2 { font-size: 36px; margin-bottom: 15px; }
    .hero p { font-size: 18px; color: #64748b; max-width: 600px; margin-bottom: 30px; }
    .btn-group { display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; }
    .btn { padding: 12px 24px; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: 600; text-decoration: none; transition: 0.2s; }
    .btn-primary { background-color: #2563eb; color: white; }
    .btn-primary:hover { background-color: #1d4ed8; }
    .btn-secondary { background-color: #0d9488; color: white; }
    .btn-secondary:hover { background-color: #0f766e; }
    .btn-dark { background-color: #334155; color: white; }
    .btn-dark:hover { background-color: #1e293b; }
    .btn-outline { background-color: transparent; border: 2px solid #64748b; color: #334155; }
    .btn-outline:hover { background-color: #e2e8f0; }

    /* Modal Styling */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
    .modal-content { background: white; padding: 30px; border-radius: 8px; width: 400px; max-width: 90%; }
    .modal-content h3 { margin-bottom: 15px; }
    .modal-content input, .modal-content textarea { width: 100%; padding: 10px; margin-bottom: 12px; border: 1px solid #ccc; border-radius: 4px; }
  </style>
</head>
<body>

  <header>
    <h1>PayGuard</h1>
    <nav class="btn-group">
      <a href="/login.html" class="btn btn-secondary">Team Login</a>
      <a href="/signup.html" class="btn btn-primary">Team Signup</a>
      <a href="/admin-login.html" class="btn btn-dark">Admin Portal</a>
    </nav>
  </header>

  <section class="hero">
    <h2>Automated Payment Slip Verification</h2>
    <p>Secure, fast, and transparent cross-verification between customer uploaded slips and bank transaction records.</p>
    
    <div class="btn-group">
      <a href="/login.html" class="btn btn-primary">Access Dashboard</a>
      <button class="btn btn-outline" onclick="openContactModal()">Contact Admin</button>
    </div>
  </section>

  <!-- Contact Admin Modal -->
  <div id="contactModal" class="modal">
    <div class="modal-content">
      <h3>Contact Admin</h3>
      <form id="contactForm">
        <input type="text" id="contactName" placeholder="Your Name" required />
        <input type="email" id="contactEmail" placeholder="Your Registered Email" required />
        <textarea id="contactMessage" rows="4" placeholder="Explain your request or ask for account re-approval..." required></textarea>
        <div style="display: flex; gap: 10px; justify-content: flex-end;">
          <button type="button" class="btn btn-outline" onclick="closeContactModal()">Cancel</button>
          <button type="submit" class="btn btn-primary">Send Message</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    function openContactModal() {
      document.getElementById('contactModal').style.display = 'flex';
    }
    function closeContactModal() {
      document.getElementById('contactModal').style.display = 'none';
    }

    document.getElementById('contactForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('contactName').value;
      const email = document.getElementById('contactEmail').value;
      const message = document.getElementById('contactMessage').value;

      const res = await fetch('/api/contact', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email, message })
      });

      const data = await res.json();
      if (res.ok) {
        alert(data.message);
        closeContactModal();
        document.getElementById('contactForm').reset();
      } else {
        alert(data.error);
      }
    });
  </script>
</body>
</html>
