<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PayGuard - Welcome</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body style="background-color: #f8fafc; font-family: sans-serif; margin: 0; padding: 0;">

  <!-- Header Navigation -->
  <header style="background: #1e293b; color: white; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center;">
    <h1 style="margin: 0; font-size: 1.5rem;">PayGuard</h1>
    <nav>
      <a href="/login.html" class="btn" style="color: white; margin-right: 15px; text-decoration: none; font-weight: 600;">Team Login</a>
      <a href="/signup.html" class="btn" style="background: #2563eb; color: white; padding: 8px 16px; border-radius: 6px; text-decoration: none; font-weight: 600;">Team Signup</a>
      <a href="/admin-login.html" class="btn" style="background: #475569; color: white; padding: 8px 16px; border-radius: 6px; text-decoration: none; font-weight: 600; margin-left: 10px;">Admin Portal</a>
    </nav>
  </header>

  <!-- Main Intro Hero Section -->
  <main class="container" style="max-width: 800px; margin: 80px auto; text-align: center; padding: 0 20px;">
    <h2 style="font-size: 2.5rem; color: #0f172a; margin-bottom: 1rem;">Automated Payment Slip Verification</h2>
    <p style="font-size: 1.2rem; color: #475569; line-height: 1.6; margin-bottom: 2rem;">
      PayGuard provides secure, fast, and transparent cross-verification between customer-uploaded payment slips and bank transaction records to prevent payment fraud.
    </p>

    <!-- Guarded Actions -->
    <div style="display: flex; justify-content: center; gap: 15px;">
      <a href="/login.html" style="background: #2563eb; color: white; padding: 12px 24px; border-radius: 6px; text-decoration: none; font-weight: bold; font-size: 1rem;">Access Dashboard</a>
      <button onclick="openContactModal()" style="background: white; border: 1px solid #cbd5e1; color: #334155; padding: 12px 24px; border-radius: 6px; font-weight: bold; font-size: 1rem; cursor: pointer;">Contact Admin</button>
    </div>
  </main>

  <!-- Contact Admin Modal -->
  <div id="contactModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center;">
    <div style="background: white; padding: 2rem; border-radius: 8px; width: 400px; max-width: 90%;">
      <h3>Contact Admin</h3>
      <form id="contactForm">
        <input type="text" id="contactName" placeholder="Your Name" required style="width: 100%; padding: 10px; margin-bottom: 10px; box-sizing: border-box;">
        <input type="email" id="contactEmail" placeholder="Your Email" required style="width: 100%; padding: 10px; margin-bottom: 10px; box-sizing: border-box;">
        <textarea id="contactMessage" placeholder="Your Message" required style="width: 100%; padding: 10px; height: 100px; margin-bottom: 10px; box-sizing: border-box;"></textarea>
        <button type="submit" style="background: #2563eb; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer;">Send</button>
        <button type="button" onclick="closeContactModal()" style="background: #64748b; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; margin-left: 5px;">Cancel</button>
      </form>
    </div>
  </div>

  <script>
    function openContactModal() { document.getElementById('contactModal').style.display = 'flex'; }
    function closeContactModal() { document.getElementById('contactModal').style.display = 'none'; }

    document.getElementById('contactForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const res = await fetch('/api/contact', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: document.getElementById('contactName').value,
          email: document.getElementById('contactEmail').value,
          message: document.getElementById('contactMessage').value
        })
      });
      const data = await res.json();
      alert(data.message || 'Message sent!');
      closeContactModal();
    });
  </script>

</body>
</html>
